name: toolchain

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: conan-io/setup-conan@v1.4.0
        with:
          version: 2.32.0
          cache_packages: true

      - name: Install the host tools
        run: brew install cmake ninja llvm

      - name: Every recipe compiles
        run: git ls-files -- recipes | grep -E '\.py$' | xargs python3 -m py_compile

      - name: The declaration reader refuses what it cannot resolve
        run: python3 tests/spec_test.py

      - name: What a declaration generates is what it declared
        run: python3 tests/generate_test.py

      - name: The base class reads a declaration and refuses the rest
        run: python3 tests/declaration_test.py

      - name: The driver takes a built engine and nothing that only resembles one
        run: python3 tests/driver_test.py

      - name: An Objective-C source stays Objective-C when cmake configures again
        run: python3 tests/cmake_language_test.py

      - name: Register the toolchain
        run: |
          conan config install "$PWD/config"
          conan remote add ios6 "$PWD" -t local-recipes-index --index 0 -f

      - name: The profile resolves
        run: |
          conan profile show -pr:h ios6-armv7
          conan profile show -pr:h ios-arm64

      # Every recipe here is our build of a third-party library, under that
      # library's own name. The user and channel are what separate it from the
      # one ConanCenter publishes, so a reference without them must not resolve
      # - otherwise remote order is all that stands between a build and a
      # recipe that cannot cross-compile for this target.
      - name: A reference without the channel does not resolve
        run: conan list "ld64/956.6" -r ios6 2>&1 | grep -q "not found"

      - name: Build the linker and check it is the one we expect
        run: LLVM_PREFIX="$(brew --prefix llvm)" conan create recipes/ld64/all --version=956.6 -pr:b default --build=missing

      - name: Build the signing tool and check it signs
        run: conan create recipes/ldid/all --version=2.1.5 -pr:h default -pr:b default --build=missing

      - name: Build the import check and see that it answers
        run: conan create recipes/ios6-imports-check/all --version=1.0 -pr:h default -pr:b default --build=missing
